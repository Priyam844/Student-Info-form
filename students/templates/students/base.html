<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Records{% endblock %}</title>
  <style>
    :root { --ink:#12203a; --muted:#5d6b85; --line:#dde4ef; --bg:#f4f7fc; --accent:#1f7a5c; --accent-dark:#155a44; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .wrap { max-width:1000px; margin:0 auto; padding:1rem; }
    nav { display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap; }
    nav a { color:var(--ink); text-decoration:none; font-weight:600; }
    nav a:hover { color:var(--accent); }
    nav .brand { font-size:1.05rem; }
    nav .spacer { flex:1; }
    .btn { display:inline-block; background:var(--accent); color:#fff !important; padding:.5rem .95rem;
           border-radius:8px; text-decoration:none; border:0; font:inherit; font-weight:600; cursor:pointer; }
    .btn:hover { background:var(--accent-dark); }
    .btn.secondary { background:#fff; color:var(--ink) !important; border:1px solid var(--line); }
    .btn.danger { background:#b42318; }
    main { padding:1.5rem 0 3rem; }
    h1 { font-size:1.5rem; margin:.2rem 0 1rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:1.25rem; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    th, td { text-align:left; padding:.65rem .8rem; border-bottom:1px solid var(--line); }
    th { background:#eef3fa; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#f8fafd; }
    .rowlink { cursor:pointer; }
    .muted { color:var(--muted); }
    .empty { padding:2.5rem 1rem; text-align:center; background:#fff; border:1px dashed var(--line); border-radius:12px; }
    form.styled p { margin:.9rem 0; }
    form.styled label { display:block; font-weight:600; margin-bottom:.3rem; }
    form.styled input[type=text], form.styled input[type=email], form.styled input[type=number],
    form.styled input[type=date], form.styled textarea, form.styled select {
      width:100%; padding:.55rem .65rem; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    form.styled input:focus, form.styled textarea:focus { outline:2px solid #9dc7b8; border-color:var(--accent); }
    .helptext { display:block; font-size:.8rem; color:var(--muted); }
    .errorlist { color:#b42318; margin:.25rem 0 0; padding-left:1.1rem; font-size:.85rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.75rem 1.5rem; }
    .grid p { margin:.35rem 0; }
    .grid .label { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .messages { list-style:none; padding:0; margin:0 0 1rem; }
    .messages li { background:#e7f6ef; border:1px solid #b7e2d0; color:#155a44;
                   padding:.6rem .9rem; border-radius:8px; margin-bottom:.5rem; }
    .actions { display:flex; gap:.6rem; margin-top:1.1rem; flex-wrap:wrap; }
    .searchbar { display:flex; gap:.5rem; margin-bottom:1rem; }
    .searchbar input { flex:1; padding:.55rem .7rem; border:1px solid var(--line); border-radius:8px; font:inherit; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="{% url 'student_list' %}">Student Records</a>
        <a href="{% url 'student_list' %}">All students</a>
        <a href="{% url 'student_create' %}">Add student</a>
        <span class="spacer"></span>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
